<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#080e1b">
  <title>Set your password | Recovero Collector</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#090e1a;color:#f4f7ff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(460px,100%);background:#121b2c;border:1px solid #273650;border-radius:18px;padding:32px 27px;box-shadow:0 14px 50px #0005}
    .brand{font-weight:850;letter-spacing:.19em;font-size:21px}
    .brand span{display:block;color:#90a2be;letter-spacing:.08em;font-size:12px;font-weight:600}
    h1{font-size:24px;line-height:1.2;margin:28px 0 8px}
    .intro{color:#aebed7;margin:0 0 18px;font-size:14px}
    label{display:block;margin:18px 0 6px;font-size:14px;font-weight:650}
    input{display:block;width:100%;font-size:17px;border:1px solid #40516c;border-radius:9px;color:#fff;background:#080f1c;outline:0;padding:13px 12px}
    input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #2563eb33}
    .hint{font-size:12px;color:#91a5c1;margin-top:7px}
    button{background:#2563eb;color:white;border:0;border-radius:9px;font-size:15px;font-weight:700;padding:15px;cursor:pointer;width:100%;margin-top:23px}
    button:disabled{opacity:.6;cursor:default}
    #message{padding:12px 0;font-size:14px;min-height:35px;color:#86efac}
    #message.error{color:#fca5a5}
    footer{font-size:12px;color:#8497b5;margin-top:18px;text-align:center}
    a{color:#93c5fd}
  </style>
</head>
<body>
  <main>
    <div class="brand">RECOVERO <span>COLLECTOR</span></div>
    <h1>Set your password</h1>
    <p class="intro">Securely activate your approved recovery operator account.</p>
    <form id="passwordForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <div class="hint">Use at least 12 characters, including a letter and a number.</div>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <button id="submit" type="submit">Activate collector account</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
    <footer>Need help? <a href="mailto:support@recovero247.co.uk">Contact Recovero support</a></footer>
  </main>
  <script>
    (() => {
      "use strict";
      // Supabase Auth returns verification tokens in a URL fragment. Copy them
      // into memory then remove the fragment before rendering any other UI.
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const query = new URLSearchParams(location.search);
      const accessToken = hash.get("access_token") || "";
      const tokenHash = hash.get("token_hash") || query.get("token_hash") || "";
      const type = hash.get("type") || query.get("type") || "";
      const linkError = hash.get("error_description") || query.get("error_description");
      history.replaceState(null, "", location.pathname);
      const form = document.getElementById("passwordForm");
      const message = document.getElementById("message");
      const button = document.getElementById("submit");

      function show(text, error = false) {
        message.textContent = text;
        message.className = error ? "error" : "";
      }
      if (linkError) {
        show("Your invitation could not be verified. Please ask Recovero to resend the setup email.", true);
      } else if (!accessToken && !tokenHash) {
        show("This invitation link is missing or has expired. Please ask Recovero to resend it.", true);
      } else {
        form.hidden = false;
        show("Email link opened. Enter your new password to activate your account.");
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        if (password !== confirm) return show("The passwords do not match.", true);
        if (password.length < 12 || !/[a-z]/i.test(password) || !/[0-9]/.test(password)) {
          return show("Use 12 or more characters with at least one letter and number.", true);
        }
        button.disabled = true;
        show("Securing your collector account…");
        try {
          const response = await fetch(
            "https://ioyegckvsgumknwtkpca.supabase.co/functions/v1/collector-onboarding", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              cache: "no-store",
              body: JSON.stringify({
                access_token: accessToken,
                token_hash: tokenHash,
                type,
                password
              })
            }
          );
          const result = await response.json();
          if (!response.ok || result.success !== true) {
            throw new Error(result.error || "Password setup could not be completed.");
          }
          form.hidden = true;
          show("Your password is set. Open the Recovero Collector app and sign in with your email and new password.");
        } catch (error) {
          show(error.message || "Unable to finish setup. Please request a new invitation.", true);
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
